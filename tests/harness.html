<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿主接口模拟 · 故事研讨助手</title><link rel="stylesheet" href="/plugin/style.css"><style>body{margin:0;background:#eae7df;font-family:system-ui;color:#343b3b}main{padding:24px}textarea{width:90%;height:90px}#main-input{position:fixed;bottom:12px;left:12px;width:calc(100% - 24px)}</style></head><body><main><h1>主故事会话</h1><p>以下是隔离验证用的主故事，不会被助手写入。</p><textarea id="main-input">主故事原输入</textarea></main>
<script>
window.__currentStory='A';window.__hostReads=[];window.__layoutListeners=[];window.__hostFrozen=false;
window.__mainState={preset:'主故事原预设',history:['主故事原消息'],world:'原世界书'};
const ctx={characterId:0,characters:[{name:'林照',avatar:'lin.png',data:{name:'林照',description:'一位负责运送家书的年轻旅人。她经历过一次未能兑现的约定，如今希望寻回旧友。',personality:'敏锐、克制，遇到旧友时犹豫。',scenario:'架空古代的江河驿路。',extensions:{world:'江河驿路'}}}],chatMetadata:{}};
window.SillyTavern={getContext:()=>ctx};
function page(ref,start,count){const total=240;return {startIndex:start,messages:Array.from({length:Math.min(count,total-start)},(_,i)=>({name:'林照',is_user:false,mes:`第${start+i}个事件：她带着家书经过渡口，还没有与旧友和解。`})),hasMoreBefore:start>0};}
const viewport=()=>({viewport:{left:visualViewport?.offsetLeft||0,top:visualViewport?.offsetTop||0,width:visualViewport?.width||innerWidth,height:visualViewport?.height||innerHeight}});
window.__TAURITAVERN__={ready:Promise.resolve(),api:{
 extension:{store:{
  tryGetJson:async({namespace,key})=>{const v=localStorage.getItem(namespace+':'+key);return v===null?{found:false}:{found:true,value:JSON.parse(v)};},
  setJson:async({namespace,key,value})=>localStorage.setItem(namespace+':'+key,JSON.stringify(value)),
  deleteJson:async({namespace,key})=>localStorage.removeItem(namespace+':'+key)
 }},
 chat:{current:{ref:()=>({kind:'character',characterId:'lin.png',fileName:window.__currentStory})},open:ref=>({
  stableId:async()=>ref.fileName,
  summary:async()=>({message_count:240,preview:'渡口的新线索',chat_metadata:{world_info:'江河驿路'}}),
  searchMessages:async options=>{window.__hostReads.push(ref.fileName);return [{index:20,role:'assistant',text:'旧约尚未兑现，两个人还没有和解。'}];},
  history:{tail:async({limit})=>page(ref,240-limit,limit),before:async(p,{limit})=>page(ref,Math.max(0,p.startIndex-limit),Math.min(limit,p.startIndex))}
 })},
 layout:{snapshot:viewport,subscribe:async fn=>{window.__layoutListeners.push(fn);fn(viewport());return ()=>{window.__layoutListeners=window.__layoutListeners.filter(f=>f!==fn);};}}
}};
for(const target of [window,window.visualViewport])target?.addEventListener('resize',()=>{if(!window.__hostFrozen)window.__layoutListeners.forEach(fn=>fn(viewport()));});
window.addEventListener('error',e=>console.error('HARNESS',e.message));
</script><script type="module" src="/plugin/index.js"></script></body></html>
